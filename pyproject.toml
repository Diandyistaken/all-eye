[project]
name = "alleye"
version = "0.1.0"
description = "Takildigin ani fark eden, cevabi vermeden once elinden tutan yerel mentor."
requires-python = ">=3.11"
dependencies = []   # bilincli tercih: sifir bagimlilik, sifir sisme

[project.scripts]
alleye = "alleye.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alleye"]
